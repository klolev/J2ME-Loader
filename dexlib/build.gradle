plugins {
    id 'com.android.library'
}

android {
    compileSdk COMPILE_SDK
    namespace 'com.android.dx'

    defaultConfig {
        minSdk MIN_SDK
        targetSdk TARGET_SDK
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'net.lingala.zip4j:zip4j:2.10.0'
    implementation 'org.ow2.asm:asm:9.8'
    // Signs a port built on the device; the same library apksigner is built around.
    implementation 'com.android.tools.build:apksig:8.5.1'
    // Signs a port built on the device: the same code 'apksigner' runs.
    implementation 'com.android.tools.build:apksig:8.5.1'
}
