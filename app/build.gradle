import ru.woesss.j2me.gradle.MidletImporter

plugins {
    id 'com.android.application'
}

// Resolves -Pmidlet=<suite> into everything the 'midlet' flavor needs; null without it.
apply from: 'midlet-import.gradle'

def midletImport = project.ext.midletImport
def midletTemplate = project.ext.midletTemplate
def releaseSigning = resolveReleaseSigning()
def midletArchivesBaseName

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        applicationId "ru.playsoftware.j2meloader"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        versionCode 101
        versionName "1.8.2"
        resValue 'string', 'app_name', rootProject.name
        // True only for a template, whose suite arrives afterwards in a second dex.
        buildConfigField 'boolean', 'PORT_TEMPLATE', 'false'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                storeFile releaseSigning.storeFile
                storePassword releaseSigning.storePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions 'default'
    productFlavors {
        play {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-play"
        }
        open {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-open"
        }
        fdroid {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }
        dev {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
            versionNameSuffix "-dev-" + generateVersionCode()
        }
        // variant dimension for an android port of a single J2ME app: either an already
        // compiled suite passed as -Pmidlet=<jar|jad>, or J2ME sources under 'app/src/midlet'
        midlet {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'false'
            def midletName
            if (midletTemplate) {
                // Placeholder identity, rewritten by the repackager once it knows the suite.
                // The label is a literal rather than a resource so that rewriting it is a
                // string-pool edit, which needs no resource compiler; a port built here
                // keeps the resource reference it has always used.
                midletName = 'J2ME_PORT_LABEL'
                applicationId 'ru.playsoftware.j2meloader.port'
                versionCode 1
                versionName '0.0.0-template'
                midletArchivesBaseName = 'midlet-template'
                buildConfigField 'boolean', 'PORT_TEMPLATE', 'true'
                // The suite is stamped in as a second dex. Every runtime from Lollipop on
                // loads those by itself, but Dalvik loads only the first, and the emulator
                // still supports it - so a template installs the rest at startup.
                multiDexEnabled true
                // A template must serve any suite, and the suite is not present to be shrunk
                // against, so it keeps the whole MIDP surface rather than what it reaches.
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                        'proguard-rules.pro', 'proguard-common.pro'
            } else if (midletImport != null) {
                midletName = midletImport.appName
                applicationId midletImport.applicationId
                versionCode midletImport.versionCode
                versionName midletImport.versionName
                midletArchivesBaseName = midletImport.archiveName
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                        'proguard-midlet.pro', 'proguard-common.pro', midletImport.proguardFile
            } else {
                // configure midlet's port project params here, as default it read from app manifest,
                // placed to 'app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF'
                def props = getMidletManifestProperties()
                midletName = props.getValue('MIDlet-Name').trim()
                def apkName = midletName.replaceAll('[/\\\\:*?\"<>|]', '').replace(' ', '_')
                applicationId "com.example.androidlet.${apkName.toLowerCase()}"
                versionName = props.getValue('MIDlet-Version')
                midletArchivesBaseName = apkName
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                        'proguard-midlet.pro', 'proguard-common.pro'
            }
            // A suite name is free text, so it can't go into a resource unescaped.
            resValue 'string', 'app_name', MidletImporter.escapeStringResource(midletName)
            manifestPlaceholders = [midletLabel: midletTemplate ? midletName : '@string/app_name']
        }
    }

    sourceSets {
        if (midletTemplate) {
            // A template carries no suite at all: the repackager appends one later.
            midlet.java.srcDirs = []
            midlet.resources.srcDirs = []
        } else if (midletImport != null) {
            // The imported suite brings its own classes, resources and descriptor in one jar,
            // so the sample port sources - and above all the sample's MANIFEST.MF - must not
            // be packaged alongside it.
            midlet.java.srcDirs = []
            midlet.resources.srcDirs = []
            if (midletImport.resDir != null) {
                midlet.res.srcDirs += midletImport.resDir
            }
        }
    }

    if (midletImport != null) {
        packaging {
            resources {
                // A suite keeps its data files at the root of its jar under whatever names it
                // chose, and AGP's stock exclusions - '/*.txt', '/LICENSE' and the like -
                // would drop them without a word. Reclaim only the patterns that actually
                // cover a file of this suite, so the rest of the list keeps doing its job,
                // and let a name shared with a library resolve instead of failing the build.
                def reclaimed = MidletImporter.resourcePatternsInUse(excludes, midletImport.resourcePaths)
                if (!reclaimed.isEmpty()) {
                    logger.lifecycle("MIDlet: keeping suite files normally excluded from packaging: "
                            + reclaimed.join(', '))
                    excludes.removeAll(reclaimed)
                    pickFirsts.addAll(reclaimed)
                }
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    applicationVariants.all {
        if (buildType.name == 'debug' && flavorName != 'midlet') {
            resValue 'string', 'app_name', 'JL-Debug'
        }
        def baseName = flavorName == 'midlet' ? "${midletArchivesBaseName}-" : "${rootProject.name}-"
        outputs.all {
            outputFileName = "${baseName}${versionName}-${dirName}-${buildType.name}.apk"
                    .replaceAll('--+', '-').replaceAll(' +', '_')
        }
    }

    buildFeatures {
        viewBinding true
    }
}

static def generateVersionCode() {
    def result = "git rev-list HEAD --count".execute().text.trim()
    return result.toInteger()
}

/**
 * Release signing credentials: the CI keystore, then the developer's keystore.properties,
 * then - only when exporting a MIDlet - a generated key, so that the exported APK is
 * installable rather than merely built. Null when none of those is available.
 */
Map<String, Object> resolveReleaseSigning() {
    if (System.getenv()['BITRISE_IO']) {
        return [keyAlias    : System.getenv('BITRISEIO_ANDROID_KEYSTORE_ALIAS'),
                keyPassword : System.getenv('BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD'),
                storeFile   : rootProject.file(System.getenv('BITRISEIO_ANDROID_KEYSTORE_NAME')),
                storePassword: System.getenv('BITRISEIO_ANDROID_KEYSTORE_PASSWORD')]
    }
    File keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.isFile()) {
        Properties keystoreProps = new Properties()
        keystoreFile.withInputStream { keystoreProps.load(it) }
        return [keyAlias    : keystoreProps['keyAlias'],
                keyPassword : keystoreProps['keyPassword'],
                storeFile   : file(keystoreProps['storeFile']),
                storePassword: keystoreProps['storePassword']]
    }
    if (project.ext.midletExportSigning != null) {
        return project.ext.midletExportSigning
    }
    logger.warn('No signing key found (keystore.properties); release APKs will be unsigned.')
    return null
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()
    if (file.exists()) {
        def is = null
        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) is.close()
        }
    }
    return mf.mainAttributes
}

dependencies {
    def roomVersion = '2.5.2'
    def cameraxVersion = "1.3.0-beta01"
    def autoServiceVersion = "1.0"

    implementation project(':dexlib')

    // The imported suite: AGP dexes its classes and packages its other entries as java
    // resources, which is exactly where AppClassLoader looks for them in a midlet build.
    if (midletImport != null) {
        midletImplementation files(midletImport.classesJar)
    }

    // Android Jetpack
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Networking && APIs
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.google.guava:guava:31.0.1-android'

    // Threads, Streams and Archives
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.10.0'

    // Audio/Video/Graphics
    implementation 'com.github.billthefarmer:mididriver:v1.21'
    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'com.github.nikita36078:mobile-ffmpeg:v4.3.2-compact'

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Android UI
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // Testing && CrashReports
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'junit:junit:4.13.2'
    implementation 'ch.acra:acra-dialog:5.9.3'

    // Other Libraries
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    compileOnly "com.google.auto.service:auto-service-annotations:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}
