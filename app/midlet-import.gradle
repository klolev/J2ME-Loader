import ru.woesss.j2me.gradle.MidletImporter

/*
 * Turns a MIDlet suite into an APK.
 *
 *     ./gradlew -Pmidlet=/path/to/game.jar assembleMidletRelease
 *
 * The 'midlet' flavor builds the emulator around a single suite instead of around an app
 * list. It was written for porting J2ME *sources*, which still works when no -Pmidlet is
 * given; this file adds the other half, taking an already compiled suite - a JAR, or a JAD
 * next to its JAR - and folding it into the same flavor.
 *
 * The import runs during configuration because the flavor's application id, version and
 * label all come out of the suite's descriptor, and AGP needs those before it creates any
 * task. It is cheap (unzip, rewrite, rezip) and skips itself when the suite has not changed.
 *
 * Properties:
 *   -Pmidlet=<path>          the suite's .jar or .jad          (or the MIDLET env variable)
 *   -PmidletPackage=<id>     application id to use instead of the derived one
 *   -PmidletVersionCode=<n>  version code to use instead of the derived one
 *
 * Per-app settings can be decided here rather than on first launch:
 *   -PmidletSettings=<path>  a config.json - the emulator writes one per app under its
 *                            'configs' directory, so tune the app there and reuse it
 *   -PmidletScreen=<WxH>     the MIDlet's screen size, e.g. 240x320
 *   -PmidletVirtualKeyboard=<bool>  show the on-screen controls
 *   -PmidletTouchInput=<bool>       deliver touches to the MIDlet as pointer events
 * Give none of these and the port asks on first launch, as it always has.
 *
 * A third mode builds a template rather than a finished port:
 *   -PmidletTemplate         an APK with placeholder identity and no suite in it, for the
 *                            on-device repackager to stamp a suite into. Build it with
 *                            -Pandroid.enableResourceOptimizations=false: the repackager
 *                            finds the icon to replace by its path, and that optimization
 *                            renames every resource file to something like 'res/BW.png'.
 */

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

ext.midletImport = null
ext.midletExportSigning = null
ext.midletManifest = null
// A template is an APK with nothing but the emulator in it, built so that the repackager
// can stamp a suite into it on a device, where no resource compiler is available.
ext.midletTemplate = findProperty('midletTemplate') != null

def midletSource = findProperty('midlet') ?: System.getenv('MIDLET')

if (midletSource && midletTemplate) {
	throw new GradleException('-Pmidlet and -PmidletTemplate ask for different things:' +
			' a port with a suite in it, and a template with none.')
}

if (midletSource) {
	File source = resolveMidletPath(midletSource.toString())
	def importer = new MidletImporter(layout.buildDirectory.dir('midlet-import').get().asFile)
	def versionCodeOverride = findProperty('midletVersionCode')?.toString()?.toInteger()
	def result = importer.importSuite(source, findProperty('midletPackage')?.toString(),
			versionCodeOverride, resolvePackagedSettings())

	logger.lifecycle("MIDlet: ${result.appName} ${result.versionName} (${result.summary})")
	logger.lifecycle("        ${result.applicationId}, versionCode ${result.versionCode}," +
			" MIDlets: ${result.midletTitles.join(', ')}")
	def uses = result.permissions.needs.collect { "${it.permission - 'android.permission.'} (${it.evidence.join(', ')})" }
	logger.lifecycle("        uses: ${uses.isEmpty() ? 'nothing that needs a permission' : uses.join('; ')}")
	importer.warnings.each { logger.warn("MIDlet import: $it") }

	ext.midletImport = result
	ext.midletManifest = writeTrimmedManifest(result)
	// A debug build is signed with the debug key, so there is no reason to make an export
	// key for one. Anything less clear-cut prepares the key: an unsigned release APK that
	// nothing can install would be the worse surprise.
	def taskNames = gradle.startParameter.taskNames
	def debugOnly = !taskNames.isEmpty() && taskNames.every { it.toLowerCase(Locale.ROOT).contains('debug') }
	ext.midletExportSigning = debugOnly ? null : resolveExportSigning()
}

/**
 * The flavor manifest to build this port against: the one in 'src/midlet' plus a removal for
 * every permission the suite gave no reason to want.
 *
 * <p>The emulator asks for everything a MIDlet might use, because it does not know which
 * MIDlet it will be asked to run. A port does know, so it can ask for less. Removing rather
 * than declaring keeps 'src/midlet/AndroidManifest.xml' the one place a port's manifest is
 * described, and a removal for a permission nothing declared is simply ignored by the merger.
 *
 * @return the generated manifest, or the stock one when the suite turns out to need it all
 */
File writeTrimmedManifest(result) {
	File base = file('src/midlet/AndroidManifest.xml')
	List<String> removable = result.permissions.removable()
	if (removable.isEmpty()) {
		return base
	}
	logger.lifecycle("        dropping ${removable.size()} permission(s) the emulator would" +
			" otherwise ask for: ${removable.collect { it - 'android.permission.' }.join(', ')}")
	String removals = removable.collect {
		"    <uses-permission android:name=\"$it\" tools:node=\"remove\" />"
	}.join('\n')
	String text = base.getText('UTF-8')
	int at = text.lastIndexOf('</manifest>')
	if (at == -1) {
		throw new GradleException("No </manifest> in $base")
	}
	String generated = text.substring(0, at) +
			"    <!-- Generated from the suite: what it never reaches for, it does not ask for. -->\n" +
			removals + "\n\n" + text.substring(at)
	File target = layout.buildDirectory.file('midlet-import/AndroidManifest.xml').get().asFile
	target.parentFile.mkdirs()
	target.setText(generated, 'UTF-8')
	return target
}

/**
 * The per-app settings to package with the port, as JSON, or null to package none.
 *
 * <p>Only the values actually chosen are written: the port lays them over the emulator's
 * own defaults at first launch, so an unmentioned setting keeps whatever the emulator
 * would otherwise have used rather than being pinned to a value now.
 */
String resolvePackagedSettings() {
	Map settings = [:]
	def settingsFile = findProperty('midletSettings')
	if (settingsFile) {
		File file = resolveMidletPath(settingsFile.toString())
		if (!file.isFile()) {
			throw new GradleException("MIDlet settings file not found: $file")
		}
		def parsed
		try {
			parsed = new JsonSlurper().parse(file, 'UTF-8')
		} catch (Exception e) {
			throw new GradleException("MIDlet settings file is not valid JSON: $file", e)
		}
		if (!(parsed instanceof Map)) {
			throw new GradleException("MIDlet settings file must hold a JSON object: $file")
		}
		settings.putAll(parsed)
	}

	def screen = findProperty('midletScreen')
	if (screen) {
		def matcher = (screen.toString().trim() =~ /^(\d+)\s*[xX*]\s*(\d+)$/)
		if (!matcher.matches()) {
			throw new GradleException("-PmidletScreen must look like 240x320, got '$screen'")
		}
		settings['ScreenWidth'] = matcher[0][1].toInteger()
		settings['ScreenHeight'] = matcher[0][2].toInteger()
	}
	putFlag(settings, 'ShowKeyboard', 'midletVirtualKeyboard')
	putFlag(settings, 'TouchInput', 'midletTouchInput')

	if (settings.isEmpty()) {
		return null
	}
	logger.lifecycle("        settings: ${settings.keySet().join(', ')}")
	return JsonOutput.toJson(settings)
}

void putFlag(Map settings, String key, String property) {
	def value = findProperty(property)
	if (value == null) {
		return
	}
	String text = value.toString().trim().toLowerCase(Locale.ROOT)
	if (!(text in ['true', 'false'])) {
		throw new GradleException("-P$property must be true or false, got '$value'")
	}
	settings[key] = text == 'true'
}

/**
 * Resolves a suite path the way a shell would: relative to where gradle was invoked, then
 * to the project, rather than to this module's directory.
 */
File resolveMidletPath(String path) {
	File asGiven = new File(path)
	if (asGiven.absolute) {
		return asGiven
	}
	def roots = [gradle.startParameter.currentDir, rootDir, projectDir]
	def candidates = roots.collect { new File(it, path) }
	return candidates.find { it.isFile() } ?: candidates.first()
}

/**
 * A signing key for the exported APK.
 *
 * <p>Android refuses to install an unsigned APK, so an export that no one can install is not
 * an export. When the repository carries no release credentials, one key is generated and
 * kept next to the project: reusing it means a rebuilt suite installs over the one already
 * on the device instead of being refused as a different app.
 *
 * @return a map of signing settings, or null if no key could be prepared
 */
Map<String, Object> resolveExportSigning() {
	File keystore = rootProject.file('midlet-export.keystore')
	String password = 'midlet-export'
	String alias = 'midlet'
	if (!keystore.isFile()) {
		File keytool = new File(System.getProperty('java.home'), 'bin/keytool')
		def command = [keytool.isFile() ? keytool.path : 'keytool',
					   '-genkeypair', '-noprompt',
					   '-keystore', keystore.path,
					   '-storepass', password,
					   '-keypass', password,
					   '-alias', alias,
					   '-keyalg', 'RSA',
					   '-keysize', '2048',
					   '-validity', '10000',
					   '-dname', 'CN=J2ME Loader MIDlet Port, O=J2ME Loader, C=US']
		try {
			def process = new ProcessBuilder(command).redirectErrorStream(true).start()
			String output = process.inputStream.text
			if (process.waitFor() != 0 || !keystore.isFile()) {
				logger.warn("MIDlet export: can't generate a signing key, the APK will be unsigned.\n$output")
				return null
			}
		} catch (Exception e) {
			logger.warn("MIDlet export: can't run keytool, the APK will be unsigned: $e")
			return null
		}
		logger.lifecycle("MIDlet export: generated a signing key at ${keystore.name}." +
				" Keep it to be able to update the installed app; replace it with" +
				" keystore.properties to sign with your own key.")
	}
	return [storeFile: keystore, storePassword: password, keyAlias: alias, keyPassword: password]
}
